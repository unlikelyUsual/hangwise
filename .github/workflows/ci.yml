name: api

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://hangwise:hangwise@localhost:5432/hangwise
      DEMO_MODE: "true"
      AUTH_MODE: development
      DEV_AUTH_SECRET: hangwise-dev-secret
      NODE_ENV: test
      HANGWISE_REPOSITORY: prisma
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hangwise
          POSTGRES_PASSWORD: hangwise
          POSTGRES_DB: hangwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hangwise -d hangwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration
