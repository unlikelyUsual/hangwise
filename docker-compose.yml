name: hangwise

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hangwise
      POSTGRES_PASSWORD: hangwise
      POSTGRES_DB: hangwise
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangwise -d hangwise"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hangwise_postgres:/var/lib/postgresql/data

volumes:
  hangwise_postgres:
